<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .title-shimmer {
        fill: url(#accentGrad);
        filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.4));
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .node-pulse-2 {
        animation: pulse 4s ease-in-out infinite alternate-reverse;
      }
      .wave-bar {
        animation: bounce 1.4s ease-in-out infinite alternate;
      }
      .wave-bar-1 { animation-delay: 0.1s; }
      .wave-bar-2 { animation-delay: 0.3s; }
      .wave-bar-3 { animation-delay: 0.5s; }
      .wave-bar-4 { animation-delay: 0.2s; }
      .wave-bar-5 { animation-delay: 0.4s; }
      .wave-bar-6 { animation-delay: 0.6s; }
      .stream-line {
        stroke-dasharray: 8, 6;
        animation: dash 15s linear infinite;
      }
      .beacon-ring {
        animation: ripple 2.5s cubic-bezier(0.1, 0.2, 0.3, 1) infinite;
        transform-origin: center;
      }
      .beacon-ring-2 {
        animation: ripple 2.5s cubic-bezier(0.1, 0.2, 0.3, 1) 1.25s infinite;
        transform-origin: center;
      }
      .orb-glow {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes bounce {
        0% { height: 8px; transform: translateY(12px); }
        100% { height: 32px; transform: translateY(0px); }
      }
      @keyframes ripple {
        0% { r: 14; opacity: 0.9; }
        100% { r: 38; opacity: 0; }
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0); }
        100% { transform: translate(25px, -20px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmospheric Orbs -->
  <g class="orb-glow">
    <circle cx="180" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />
    <circle cx="1020" cy="290" r="160" fill="#a855f7" opacity="0.12" filter="url(#softGlow)" />
    <circle cx="600" cy="190" r="180" fill="#6366f1" opacity="0.09" filter="url(#softGlow)" />
  </g>

  <!-- High-Tech Coordinate Grid Backdrop -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="350" y1="0" x2="350" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="950" y1="0" x2="950" y2="380" />
    <line x1="1150" y1="0" x2="1150" y2="380" />
  </g>

  <!-- WebRTC Connection Topology Stream Lines -->
  <g stroke="url(#accentGrad)" stroke-width="1.8" opacity="0.4" fill="none" class="stream-line">
    <path d="M 80,190 C 180,80 300,110 420,190" />
    <path d="M 420,190 C 540,270 660,260 780,190" />
    <path d="M 780,190 C 900,120 1020,130 1120,190" />
    <path d="M 180,310 C 350,210 850,210 1020,80" stroke="#f472b6" stroke-width="1.2" opacity="0.25" />
  </g>

  <!-- Left Video / Audio Hub Node Card -->
  <g transform="translate(60, 110)">
    <rect width="140" height="150" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" opacity="0.9" />
    <rect width="140" height="150" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5" />
    
    <!-- Video Camera Icon -->
    <g transform="translate(42, 28)">
      <rect x="0" y="6" width="36" height="26" rx="6" fill="#38bdf8" opacity="0.9" />
      <polygon points="38,13 54,4 54,34 38,25" fill="#38bdf8" opacity="0.9" />
      <circle cx="18" cy="19" r="6" fill="#0f172a" />
      <circle cx="18" cy="19" r="3" fill="#38bdf8" />
    </g>

    <!-- Animated Audio Waveform Equalizer -->
    <g transform="translate(26, 85)" fill="#818cf8">
      <rect class="wave-bar wave-bar-1" x="0" y="0" width="8" rx="4" />
      <rect class="wave-bar wave-bar-2" x="16" y="0" width="8" rx="4" />
      <rect class="wave-bar wave-bar-3" x="32" y="0" width="8" rx="4" />
      <rect class="wave-bar wave-bar-4" x="48" y="0" width="8" rx="4" />
      <rect class="wave-bar wave-bar-5" x="64" y="0" width="8" rx="4" />
      <rect class="wave-bar wave-bar-6" x="80" y="0" width="8" rx="4" />
    </g>

    <text x="70" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">LIVE STREAM</text>
  </g>

  <!-- Right Media Topology Hub Card -->
  <g transform="translate(1000, 110)">
    <rect width="140" height="150" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" opacity="0.9" />
    <rect width="140" height="150" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5" />
    
    <!-- Screen Sharing & WebRTC Nodes -->
    <g transform="translate(36, 26)">
      <!-- Monitor -->
      <rect x="0" y="0" width="68" height="46" rx="5" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
      <polygon points="34,10 24,24 44,24" fill="#c084fc" opacity="0.8" />
      <line x1="34" y1="46" x2="34" y2="56" stroke="#c084fc" stroke-width="3" />
      <line x1="22" y1="56" x2="46" y2="56" stroke="#c084fc" stroke-width="3" />
    </g>

    <!-- Pulsing Signal Waves -->
    <circle cx="70" cy="108" r="8" fill="#34d399" />
    <circle cx="70" cy="108" r="16" fill="none" stroke="#34d399" stroke-width="1.5" class="beacon-ring" />
    <circle cx="70" cy="108" r="16" fill="none" stroke="#34d399" stroke-width="1.5" class="beacon-ring-2" />

    <text x="70" y="136" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">P2P / SFU 100%</text>
  </g>

  <!-- Center Content Area -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 72)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-145" cy="0" r="5" fill="#38bdf8" />
    <text x="0" y="5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">REAL-TIME COLLABORATION ECOSYSTEM</text>
    <circle cx="145" cy="0" r="5" fill="#f472b6" />
  </g>

  <!-- Main Title -->
  <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5" class="title-shimmer">Awesome Video Conferencing</text>

  <!-- Subtitle -->
  <text x="600" y="185" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="0.5">The Ultimate Curated Guide to SaaS Platforms, WebRTC Media Stacks &amp; Self-Hosted Solutions</text>

  <!-- Feature Highlights Chips -->
  <g transform="translate(600, 245)">
    <!-- Chip 1: Enterprise SaaS -->
    <g transform="translate(-290, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Enterprise SaaS</text>
    </g>
    <!-- Chip 2: Open-Source SFU / MCU -->
    <g transform="translate(-95, 0)">
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open-Source WebRTC</text>
    </g>
    <!-- Chip 3: Self-Hosting & Privacy -->
    <g transform="translate(110, 0)">
      <rect x="-90" y="-15" width="180" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Self-Hosted &amp; E2EE</text>
    </g>
    <!-- Chip 4: AI & Recordings -->
    <g transform="translate(295, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" />
      <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI &amp; Webhooks</text>
    </g>
  </g>

  <!-- Bottom Metric Tagline -->
  <text x="600" y="325" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="1">UPDATED AUGUST 2026 • 100% CURATED &amp; COMMUNITY VERIFIED</text>
</svg>